TalentIntakeMapper.findIntakes.expanded.query=SELECT 1 FROM talent_resume_intake i JOIN talent_intake_batch b ON b.id \= i.batch_id LEFT JOIN talent_candidate candidate ON candidate.id \= i.candidate_id LEFT JOIN talent_resume_intake_processing p ON p.id \= i.processing_id WHERE i.status \!\= 'IGNORED' AND (? IS NULL OR i.batch_id \= ?) AND (? IS NULL OR (? \= 'PROBLEM' AND (i.status IN ('IDENTITY_REVIEW_REQUIRED', 'READY_FOR_CONFIRMATION', 'FAILED_RETRYABLE', 'REJECTED', 'QUARANTINED') OR i.score_status IN ('FAILED_RETRYABLE', 'FAILED_FINAL') OR b.jd_version_id IS NULL OR i.failure_code \= 'RESUME_VERSION_DUPLICATE_CONTENT' OR EXISTS (SELECT 1 FROM talent_resume_intake problem_duplicate WHERE problem_duplicate.content_sha256 \= i.content_sha256 AND problem_duplicate.id \!\= i.id))) OR (? \= 'IDENTITY_REVIEW' AND i.status IN ('IDENTITY_REVIEW_REQUIRED', 'READY_FOR_CONFIRMATION')) OR (? \= 'FAILED' AND (i.status IN ('FAILED_RETRYABLE', 'REJECTED', 'QUARANTINED') OR i.score_status IN ('FAILED_RETRYABLE', 'FAILED_FINAL'))) OR (? \= 'MISSING_JD' AND b.jd_version_id IS NULL) OR (? NOT IN ('PROBLEM', 'IDENTITY_REVIEW', 'FAILED', 'MISSING_JD') AND i.status \= ?)) AND (? IS NULL OR CASE WHEN i.status \= 'COMPLETED' AND i.score_status \= 'SUCCEEDED' THEN 'IMPORTED' WHEN i.status IN ('PARSING', 'CONFIRMED', 'COMPLETED') THEN 'PROCESSING' ELSE 'PENDING' END \= ?) AND (? IS NULL OR (EXISTS (SELECT 1 FROM talent_resume_intake duplicate_intake WHERE duplicate_intake.content_sha256 \= i.content_sha256 AND duplicate_intake.id \!\= i.id) OR i.failure_code \= 'RESUME_VERSION_DUPLICATE_CONTENT') \= ?) AND (? IS NULL OR i.original_file_name LIKE CONCAT('%', ?, '%') OR candidate.full_name LIKE CONCAT('%', ?, '%') OR candidate.primary_email LIKE CONCAT('%', ?, '%') OR candidate.primary_phone LIKE CONCAT('%', ?, '%')) AND (? IS NULL OR candidate.full_name LIKE CONCAT('%', ?, '%')) AND (? IS NULL OR i.create_time >\= ?) AND (? IS NULL OR i.create_time < ?) AND (? \= true OR i.owner_user_id \= ? OR i.owner_user_id IN (?, ?) OR i.owner_department_id IN (?, ?)) AND (? IS NULL OR i.create_time < ? OR (i.create_time \= ? AND i.id < ?)) ORDER BY i.create_time DESC, i.id DESC LIMIT ?
TalentIntakeMapper.findResumeVersions.empty.bindings=candidateId,cursorVersionNo,cursorVersionNo,cursorVersionNo,cursorId,limit
TalentIntakeMapper.findResumeVersions.empty.fields=v.content_sha256 | v.create_id | v.create_name | v.create_time | v.ext | v.id | v.intake_id | v.media_type | v.object_key | v.original_file_name | v.remark | v.resume_id | v.size_bytes | v.status | v.update_id | v.update_name | v.update_time | v.version | v.version_no
TalentIntakeMapper.findResumeVersions.empty.query=SELECT 1 FROM talent_resume_version v JOIN talent_resume r ON r.id \= v.resume_id WHERE r.candidate_id \= ? AND (? IS NULL OR v.version_no < ? OR (v.version_no \= ? AND v.id < ?)) ORDER BY v.version_no DESC, v.id DESC LIMIT ?
