# 复制到服务器 /opt/vgo/shared/application-prod-secrets.yml，替换占位值，设置 root:vgo 及权限 640。
spring:
  datasource:
    password: "REPLACE_WITH_DATABASE_PASSWORD"
  ai:
    openai:
      api-key: "REPLACE_WITH_MODEL_STUDIO_API_KEY"

hr:
  mail-resume:
    # 填好真实收件账号及授权码后开启；首次建立零基线，不采集旧邮件。
    enabled: false
    # 更换账号或文件夹时同时更换此键，避免复用旧邮箱游标。
    mailbox-key: public-resume
    host: imap.qq.com
    port: 993
    username: "REPLACE_WITH_RESUME_MAILBOX"
    password: "REPLACE_WITH_MAIL_AUTHORIZATION_CODE"
    folder: INBOX
  identity:
    login-alias:
      # 仅映射登录名 admin，账号资料仍保留真实工作邮箱。
      admin-work-email: "REPLACE_WITH_ADMIN_EMAIL"
  ai:
    archive-key: "REPLACE_WITH_32_BYTE_BASE64_KEY"
  pagination:
    cursor-signing-key: "REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS"
  search:
    elasticsearch:
      username: "elastic"
      password: "REPLACE_WITH_ELASTIC_PASSWORD"
  bootstrap-admin:
    enabled: true
    department-code: ROOT
    department-name: 总部
    display-name: 系统管理员
    work-email: "REPLACE_WITH_ADMIN_EMAIL"
    password: "REPLACE_WITH_INITIAL_ADMIN_PASSWORD"
