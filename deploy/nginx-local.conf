server_tokens off;

# 本机同源入口：网页与 API 共用端口，后端不直接发布到宿主机。
map $uri $login_rate_key {
    default "";
    /api/v1/auth/login $binary_remote_addr;
}
limit_req_zone $login_rate_key zone=login_rate:10m rate=10r/s;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 21m;
    # 本机招聘查询可能含人员信息，不记录完整 URL。
    access_log off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend_upstream backend:8080;

    include /etc/nginx/security-headers.inc;

    location = /healthz {
        proxy_pass http://$backend_upstream/actuator/health/readiness;
        proxy_set_header Host $host;
        access_log off;
    }

    location /api/ {
        limit_req zone=login_rate burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
