server_tokens off;

server {
    listen 80;
    listen unix:/run/web-sockets/@WEB_SLOT@.sock;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    location ^~ /fonts/noto-sans-sc-v40/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ^~ /_build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|webp|mp4|webm|ico|woff2?)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
