server_tokens off;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

# 仅限制登录入口；空键的其他 API 请求不计入此共享内存区。
map $uri $login_rate_key {
    default "";
    /api/v1/auth/login $binary_remote_addr;
}
limit_req_zone $login_rate_key zone=login_rate:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name vgo.example.org www.vgo.example.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://www.vgo.example.org$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vgo.example.org;

    ssl_certificate /etc/letsencrypt/live/www.vgo.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.vgo.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/conf.d/security-headers.inc;

    return 301 https://www.vgo.example.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.vgo.example.org;

    client_max_body_size 21m;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend_upstream backend:8080;

    ssl_certificate /etc/letsencrypt/live/www.vgo.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.vgo.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/conf.d/security-headers.inc;

    location = /healthz {
        proxy_pass http://$backend_upstream/actuator/health/readiness;
        proxy_set_header Host $host;
        access_log off;
    }

    location /api/ {
        # 按直连对端限流，不信任未经核实的转发来源头。
        limit_req zone=login_rate burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://unix:/run/web-sockets/active.sock:;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
}
